# Official OUYANG data module; still a small integration pilot, not formal training.
condition: C
run_kind: pilot
protocol_confirmed: false
seed: 5421
data_manifest: Images/manifest.csv
data_root: Images
dataset_factory: src.training.ouyang_factory:build_datasets
data_config: configs/ouyang_data_v1.json
weights: IMAGENET1K_V1
freeze_policy: layer4_head_frozen_bn
lr: 0.0001
weight_decay: 0.01
batch: 4
accumulation_steps: 4
epochs: 2
early_stop: 2
amp: true
amp_init_scale: 1024.0
deterministic: true
device: cuda
num_workers: 0
cpu_threads: 2
train_limit: 32
val_limit: 16
consistency_weight: 1.0
